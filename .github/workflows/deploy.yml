name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: bcsoccerclub
  CLOUDFRONT_DISTRIBUTION_ID: E2ROO7A769UCO2
  LAMBDA_FUNCTION_NAME: bcsoccerclub-api
  DYNAMODB_TABLE_NAME: bcsoccerclub-state
  VITE_API_BASE_URL: https://6oumqshk75.execute-api.us-east-1.amazonaws.com

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test and lint
        run: |
          npm test
          npm run lint

      - name: Confirm staff authentication secrets
        env:
          STAFF_PASSWORD_HASH: ${{ secrets.STAFF_PASSWORD_HASH }}
          STAFF_AUTH_SECRET: ${{ secrets.STAFF_AUTH_SECRET }}
        run: |
          test -n "$STAFF_PASSWORD_HASH"
          test -n "$STAFF_AUTH_SECRET"

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy roster API
        env:
          STAFF_PASSWORD_HASH: ${{ secrets.STAFF_PASSWORD_HASH }}
          STAFF_AUTH_SECRET: ${{ secrets.STAFF_AUTH_SECRET }}
        run: |
          mkdir lambda-package
          cp lambda/bcsoccerclub-api.mjs lambda-package/index.mjs
          (cd lambda-package && zip ../lambda.zip index.mjs)
          jq -n \
            --arg table "$DYNAMODB_TABLE_NAME" \
            --arg passwordHash "$STAFF_PASSWORD_HASH" \
            --arg authSecret "$STAFF_AUTH_SECRET" \
            '{Variables:{TABLE_NAME:$table,STAFF_PASSWORD_HASH:$passwordHash,STAFF_AUTH_SECRET:$authSecret}}' \
            > lambda-environment.json
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://lambda.zip
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --environment file://lambda-environment.json
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Upload dist to S3
        run: aws s3 sync dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
